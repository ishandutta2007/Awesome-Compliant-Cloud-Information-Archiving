<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; border-radius: 14px; overflow: hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.5" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: pulseOrb1 8s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: pulseOrb2 10s ease-in-out infinite alternate;
      }
      .data-stream {
        stroke-dasharray: 8 12;
        animation: streamFlow 20s linear infinite;
      }
      .data-stream-rev {
        stroke-dasharray: 6 10;
        animation: streamFlowRev 15s linear infinite;
      }
      .node-pulse {
        animation: nodeBlink 3s ease-in-out infinite;
      }
      .card-float {
        animation: floatCard 6s ease-in-out infinite alternate;
      }
      @keyframes pulseOrb1 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        100% { transform: scale(1.25) translate(40px, 20px); opacity: 0.6; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1.1) translate(0px, 0px); opacity: 0.3; }
        100% { transform: scale(0.9) translate(-30px, -20px); opacity: 0.55; }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes nodeBlink {
        0%, 100% { opacity: 0.4; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      @keyframes floatCard {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <g filter="blur(60px)">
    <circle class="glow-orb-1" cx="200" cy="100" r="160" fill="#0284c7" />
    <circle class="glow-orb-2" cx="1000" cy="320" r="180" fill="#7c3aed" />
    <circle class="glow-orb-1" cx="600" cy="380" r="140" fill="#0ea5e9" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Animated Compliance Data Stream Lines (Background) -->
  <g opacity="0.45">
    <path class="data-stream" d="M -50,60 Q 300,120 600,40 T 1250,80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="data-stream-rev" d="M -50,340 Q 350,260 700,360 T 1250,300" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="data-stream" d="M -50,200 C 250,150 450,280 800,170 S 1100,240 1250,190" fill="none" stroke="#0ea5e9" stroke-width="1" />
    
    <!-- Dynamic Network Nodes -->
    <circle class="node-pulse" cx="220" cy="85" fill="#38bdf8" />
    <circle class="node-pulse" cx="540" cy="50" fill="#818cf8" style="animation-delay: 1s;" />
    <circle class="node-pulse" cx="950" cy="70" fill="#c084fc" style="animation-delay: 2s;" />
    <circle class="node-pulse" cx="300" cy="295" fill="#38bdf8" style="animation-delay: 1.5s;" />
    <circle class="node-pulse" cx="720" cy="358" fill="#a855f7" style="animation-delay: 0.5s;" />
  </g>

  <!-- Decorative Floating Stat / Architecture Badges (Dynamic, Subdued) -->
  <g class="card-float" opacity="0.85">
    <!-- Card Left -->
    <g transform="translate(60, 48)">
      <rect width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#22c55e" />
      <text x="36" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">WORM RETENTION</text>
    </g>

    <!-- Card Right -->
    <g transform="translate(960, 48)">
      <rect width="180" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SEC 17a-4 / FINRA</text>
    </g>
  </g>

  <!-- Main Hero Foreground Content (Prominent, High-Contrast, Crystal Clear) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 105)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="-138" cy="0" r="4" fill="#38bdf8" />
    <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2">ENTERPRISE INFORMATION GOVERNANCE</text>
  </g>

  <!-- Primary Title -->
  <text x="600" y="175" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Compliant Cloud Information Archiving
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" letter-spacing="0.2">
    Curated Enterprise SaaS Leaders &amp; Sovereign Open-Source Archiving Engines
  </text>

  <!-- Tagline / Description -->
  <text x="600" y="256" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Immutable WORM Retention • Automated Legal Holds • eDiscovery • Supervisory Auditing
  </text>

  <!-- Standards & Mandates Feature Pills (Lower Foreground) -->
  <g transform="translate(600, 325)">
    <!-- Pill 1: SEC 17a-4 -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚖️ SEC 17a-4</text>
    </g>

    <!-- Pill 2: FINRA -->
    <g transform="translate(-215, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ FINRA 4511</text>
    </g>

    <!-- Pill 3: MiFID II -->
    <g transform="translate(-75, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🇪🇺 MiFID II</text>
    </g>

    <!-- Pill 4: HIPAA & GDPR -->
    <g transform="translate(80, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔒 HIPAA / GDPR</text>
    </g>

    <!-- Pill 5: eDiscovery -->
    <g transform="translate(245, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 eDiscovery</text>
    </g>

    <!-- Pill 6: WORM Lock -->
    <g transform="translate(390, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="16" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📦 WORM S3</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
